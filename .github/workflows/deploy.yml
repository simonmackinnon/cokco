name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/deploy.yml'
            site:
              - 'site/**'

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -input=false
      - name: Terraform validate
        run: terraform validate
      - name: Terraform apply
        run: terraform apply -auto-approve -input=false

  deploy-site:
    needs: [changes, terraform]
    if: |
      always() &&
      (needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      SITE_BUCKET: cokco.theclouddevopslearningblog.com
      SITE_DOMAIN: cokco.theclouddevopslearningblog.com
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Wait for the site bucket to exist
        run: |
          for i in $(seq 1 60); do
            if aws s3api head-bucket --bucket "$SITE_BUCKET" 2>/dev/null; then
              echo "bucket is ready"; exit 0
            fi
            echo "waiting for s3://$SITE_BUCKET ... ($i/60)"; sleep 10
          done
          echo "::error::$SITE_BUCKET not found. Run the infra job first (push a change under infra/ or dispatch this workflow)."
          exit 1
      - name: Sync site/ to S3
        run: |
          aws s3 sync site/ "s3://$SITE_BUCKET/" --delete \
            --cache-control "public,max-age=300" \
            --exclude "index.html"
          aws s3 cp site/index.html "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '$SITE_DOMAIN')].Id | [0]" \
            --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "invalidating $DIST_ID"
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'
          else
            echo "no CloudFront distribution for $SITE_DOMAIN yet — skipping invalidation"
          fi
