<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="Cokco — a little 2D platformer built from a kid's game design. Explore layers, talk to creatures, solve their problems.">
<meta name="theme-color" content="#0d1220">
<title>Cokco</title>
<style>
  html,body{margin:0;height:100%;background:#0d1220;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{position:absolute;inset:0;pointer-events:none;}
  #hud{position:absolute;top:12px;left:14px;font-size:14px;line-height:1.5;
    text-shadow:0 2px 6px rgba(0,0,0,.65);max-width:min(420px,70vw);}
  #hud b{font-size:17px;}
  #obj{opacity:.95;margin-top:2px;}
  #urch{margin-top:4px;opacity:.9;font-size:15px;}
  #urch span{display:inline-block;margin-right:9px;white-space:nowrap;}
  #hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    background:rgba(10,14,24,.72);padding:8px 15px;border-radius:999px;font-size:13px;white-space:nowrap;}
  #toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:90vw;}
  .toast{background:rgba(255,214,120,.97);color:#3a2a00;font-weight:600;padding:8px 16px;
    border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);text-align:center;}
  #dialogue{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    width:min(680px,92vw);background:rgba(12,16,28,.95);border:2px solid #ffd678;
    border-radius:14px;padding:15px 18px;pointer-events:auto;}
  #dialogue .who{color:#ffd678;font-weight:700;margin-bottom:4px;}
  #dialogue .txt{font-size:15px;line-height:1.55;min-height:46px;}
  #dialogue .go{text-align:right;font-size:12px;opacity:.65;margin-top:4px;}
  .panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(560px,92vw);max-height:82vh;overflow:auto;background:rgba(12,16,28,.97);
    border:2px solid #8fd3ff;border-radius:16px;padding:20px 22px;pointer-events:auto;}
  .panel h2{margin:0 0 10px;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
  .slot{aspect-ratio:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;gap:2px;text-align:center;padding:2px;}
  .slot .ic{font-size:22px;}
  canvas.ic{width:26px;height:26px;}
  .slot .q{opacity:.8;}
  .qz{margin:7px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);}
  .qz.done{opacity:.55;}
  .qz.done b{text-decoration:line-through;}
  .qz .o{font-size:13px;opacity:.85;margin-top:2px;}
  .btn{pointer-events:auto;display:inline-block;margin:8px 8px 0 0;padding:9px 15px;border-radius:10px;
    background:#8fd3ff;color:#06263a;font-weight:700;cursor:pointer;border:none;font-size:14px;}
  .btn.alt{background:rgba(255,255,255,.14);color:#fff;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,#28477a,#0d1220);pointer-events:auto;text-align:center;padding:20px;}
  #title h1{font-size:clamp(44px,12vw,76px);margin:0;letter-spacing:8px;color:#ff9d6f;text-shadow:0 6px 0 #b5623c;}
  #title p{opacity:.82;margin:6px 0;}
  #title .credit{font-size:13px;opacity:.6;margin-top:4px;letter-spacing:.3px;}
  .hidden{display:none!important;}
  kbd{background:rgba(255,255,255,.18);border-radius:5px;padding:1px 6px;font-size:12px;}

  /* ---- on-screen touch controls (shown only on touch devices, or ?touch=1) ---- */
  #touch{position:absolute;inset:0;z-index:6;pointer-events:none;display:none;}
  html.touch #touch{display:block;}
  .tcb{position:absolute;display:none;align-items:center;justify-content:center;
    width:62px;height:62px;border-radius:50%;
    border:2px solid rgba(255,255,255,.55);background:rgba(10,14,24,.4);
    color:#fff;font-size:24px;line-height:1;font-family:inherit;
    pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;}
  .tcb:active{background:rgba(255,255,255,.3);transform:scale(.94);}
  .tcb.tcs{width:42px;height:42px;font-size:18px;border-width:1px;background:rgba(10,14,24,.34);}
  .b-left  {left:calc(18px + env(safe-area-inset-left));  bottom:calc(26px + env(safe-area-inset-bottom));}
  .b-right {left:calc(100px + env(safe-area-inset-left));  bottom:calc(26px + env(safe-area-inset-bottom));}
  .b-jump  {right:calc(20px + env(safe-area-inset-right)); bottom:calc(24px + env(safe-area-inset-bottom));width:80px;height:80px;font-size:30px;}
  .b-act   {right:calc(106px + env(safe-area-inset-right));bottom:calc(52px + env(safe-area-inset-bottom));}
  .tcs     {top:calc(10px + env(safe-area-inset-top));}
  .b-bag   {right:calc(202px + env(safe-area-inset-right));}
  .b-prob  {right:calc(154px + env(safe-area-inset-right));}
  .b-orb   {right:calc(106px + env(safe-area-inset-right));}
  .b-blk   {right:calc(58px + env(safe-area-inset-right));}
  .b-menu  {right:calc(10px + env(safe-area-inset-right));}
  #touch[data-mode="play"] .tcb{display:flex;}
  #touch:not(.has-orb) .b-orb{display:none!important;}
  #touch:not(.has-block) .b-blk{display:none!important;}
  #touch[data-mode="dialogue"] .b-left,
  #touch[data-mode="dialogue"] .b-right,
  #touch[data-mode="dialogue"] .b-act{display:flex;}
  #touch[data-mode="minigame"] .b-left,
  #touch[data-mode="minigame"] .b-right,
  #touch[data-mode="minigame"] .b-menu{display:flex;}
  html.touch #hint{bottom:100px;}
  @media (max-width:430px){
    .tcb.tcs{width:36px;height:36px;font-size:16px;}
    .b-bag {right:calc(160px + env(safe-area-inset-right));}
    .b-prob{right:calc(122px + env(safe-area-inset-right));}
    .b-orb {right:calc(84px + env(safe-area-inset-right));}
    .b-blk {right:calc(46px + env(safe-area-inset-right));}
    .b-menu{right:calc(8px + env(safe-area-inset-right));}
  }
  @media (max-width:380px){
    .tcb{width:54px;height:54px;font-size:21px;}
    .b-right{left:calc(84px + env(safe-area-inset-left));}
    .b-jump{width:70px;height:70px;font-size:26px;}
    .b-act{right:calc(92px + env(safe-area-inset-right));bottom:calc(46px + env(safe-area-inset-bottom));}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="overlay">
    <div id="hud" class="hidden"><b id="worldName">&mdash;</b><div id="obj"></div><div id="urch"></div></div>
    <div id="hint" class="hidden"></div>
    <div id="toast"></div>
    <div id="dialogue" class="hidden"><div class="who"></div><div class="txt"></div><div class="go">&#9654; <kbd>E</kbd> / <kbd>Space</kbd></div></div>
    <div id="panel" class="panel hidden"></div>
    <div id="touch" data-mode="title">
      <button class="tcb b-left"  data-hold="ArrowLeft"  aria-label="Move left">&#9664;</button>
      <button class="tcb b-right" data-hold="ArrowRight" aria-label="Move right">&#9654;</button>
      <button class="tcb b-jump"  data-hold="ArrowUp"    aria-label="Jump">&#9650;</button>
      <button class="tcb b-act"   data-tap="KeyE"        aria-label="Talk or open">E</button>
      <button class="tcb tcs b-bag"  data-tap="KeyI"     aria-label="Bag">&#128188;</button>
      <button class="tcb tcs b-prob" data-tap="KeyJ"     aria-label="Problems">&#128203;</button>
      <button class="tcb tcs b-orb"  data-tap="KeyQ"     aria-label="Change form">&#9210;</button>
      <button class="tcb tcs b-blk"  data-tap="KeyB"     aria-label="Place / take block">&#9635;</button>
      <button class="tcb tcs b-menu" data-tap="Escape"   aria-label="Menu">&#9776;</button>
    </div>
  </div>
  <div id="title">
    <h1>COKCO</h1>
    <p>a tiny world of problems to solve</p>
    <p class="credit">An AI-built game designed by Avery</p>
    <div style="margin-top:14px">
      <button class="btn" id="playBtn">Play &#9654;</button>
      <button class="btn alt" id="newBtn">New game</button>
    </div>
    <p style="margin-top:20px;font-size:13px;opacity:.72;max-width:560px">
      move <kbd>&larr; &rarr;</kbd> / <kbd>A D</kbd> &nbsp;&middot;&nbsp;
      jump <kbd>&uarr;</kbd> / <kbd>W</kbd> / <kbd>Space</kbd> &nbsp;&middot;&nbsp;
      talk &amp; open <kbd>E</kbd> &nbsp;&middot;&nbsp;
      bag <kbd>I</kbd> &nbsp;&middot;&nbsp; problems <kbd>J</kbd> &nbsp;&middot;&nbsp; menu <kbd>Esc</kbd>
    </p>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   COKCO  -  a 2D platformer built from a kid's game design.
   One file, no build step. Just open this file in a browser.

   MAP OF THE CODE
     1  config + helpers
     2  input
     3  save / load
     4  items
     5  worlds        <-- ADD NEW WORLDS / PLATFORMS / NPCS HERE
     6  quests        <-- ADD NEW PROBLEMS HERE
     7  physics
     8  play update
     9  dialogue
    10  sea-urchin catching minigame
    11  drawing
    12  UI panels (bag / problems / menu / map)
    13  main loop
   ============================================================ */

/* ---------- 1. config + helpers ---------- */
const C = document.getElementById('c');
const ctx = C.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = window.innerWidth; VH = window.innerHeight;
  C.width = VW * DPR; C.height = VH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (world) makeBubbles(world);
}
window.addEventListener('resize', resize);

const CFG = {
  cokco: { color: '#e4ded4', cap: '#6f6a63', w: 26, h: 34 },  // <-- Cokco: pale body + grey top cap
  step: 16,        // tallest ledge Cokco walks straight up (this is how stairs work)
  coyote: 0.10,    // grace time to still jump just after walking off an edge
  buffer: 0.12,    // press jump slightly early and it still fires on landing
};
const clamp = (v,a,b) => v<a ? a : v>b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const chance = p => Math.random() < p;
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------- 2. input ---------- */
const keys = new Set(), pressed = new Set();
const ALIAS = {
  KeyA:'left', ArrowLeft:'left', KeyD:'right', ArrowRight:'right',
  KeyW:'jump', ArrowUp:'jump', Space:'jump', KeyS:'down', ArrowDown:'down',
};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  keys.add(e.code);
});
addEventListener('keyup', e => keys.delete(e.code));
function held(action){
  for (const code in ALIAS) if (ALIAS[code] === action && keys.has(code)) return true;
  return false;
}
function tapped(action){
  for (const code in ALIAS) if (ALIAS[code] === action && pressed.has(code)) return true;
  return false;
}
function key(...codes){ return codes.some(c => pressed.has(c)); }
function clearTaps(){ pressed.clear(); }

/* ---------- 2b. on-screen touch controls ----------
   The buttons in #touch feed the same `keys` / `pressed` sets the keyboard uses,
   so the rest of the game needs no mobile-specific code.
     data-hold="Code"  → key is down while the button is held (walk, jump)
     data-tap="Code"   → key registers for a single frame on press (talk, bag, menu)
   Visibility per game mode is pure CSS driven by #touch[data-mode]. */
const touchEl = document.getElementById('touch');
(function initTouch(){
  const qs = (typeof location !== 'undefined' && location.search) || '';
  const forced = /[?&]touch=1/.test(qs);
  const isTouch = forced ||
    (typeof matchMedia === 'function' && matchMedia('(hover: none) and (pointer: coarse)').matches) ||
    (typeof window !== 'undefined' && 'ontouchstart' in window) ||
    (typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0);
  if (isTouch && document.documentElement) document.documentElement.classList.add('touch');
  if (!touchEl || !touchEl.querySelectorAll) return;

  const codeDown = c => { if (!keys.has(c)) pressed.add(c); keys.add(c); };
  const codeUp   = c => { keys.delete(c); };

  touchEl.querySelectorAll('button').forEach(btn => {
    const hold = btn.dataset.hold;
    const code = hold || btn.dataset.tap;
    if (!code) return;
    const down = e => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      codeDown(code);
      if (!hold) codeUp(code);            // tap: seen for one frame, then released
    };
    const up = e => { if (e) e.preventDefault(); if (hold) codeUp(code); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('lostpointercapture', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // tap the dialogue box itself to advance it
  const dlg = document.getElementById('dialogue');
  if (dlg) dlg.addEventListener('pointerdown', e => {
    if (mode === 'dialogue') { e.preventDefault(); pressed.add('KeyE'); }
  });

  // drop any held buttons if the tab is backgrounded / loses focus
  const releaseAll = () => keys.clear();
  addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
})();
function syncTouchUI(){
  if (!touchEl) return;
  if (touchEl.dataset.mode !== mode) touchEl.dataset.mode = mode;
  touchEl.classList.toggle('has-orb', !!(G.orbs && (G.orbs.slime || G.orbs.hammer)));
  touchEl.classList.toggle('has-block',
    !!(world && (invCount('urchin-block') > 0 || (G.placed[world.key] || []).length > 0)));
}

/* ---------- 3. save / load ---------- */
const SAVE_KEY = 'cokco-save-v2';
function blankSave(){
  return {
    world: 'home', px: null, py: null,
    quests: { ocean:'inactive', craft:'inactive', pearl:'inactive',
              hammer:'inactive', swim:'inactive', slime:'inactive', block:'inactive', climb:'inactive', dirtfly:'inactive' },
    flags:  { greenStairs:false, oceanCalm:false, grabber:false, allSolvedSeen:false },
    orbs:   { hammer:false, slime:false, snake:false, fly:false },   // unlocked Cokco-orb forms
    inv: [],            // [{id, qty}]  -  10 slots, 20 per slot
    coins: 0,           // Cokco-coins (from chests / shops)
    gems: 0,            // gems (rare - from chests / gem boxes)
    gold: 0,            // gold (from the mining shop)
    mgCap: 6,           // sea-urchin basket size (grows to 10)
    boxes: {},          // "world:index" -> true once a box is popped
    chests: {},         // "world:cN" / "world:gN" -> true once a chest/gem-box is opened
    rocks: {},          // "world:rN" -> true once smashed by hammer form
    placed: {},         // "world" -> [{x,y}] sea-urchin blocks the player set down
    picked: {},         // "pk:world:index" -> true once a floor pickup is taken
  };
}
let G = loadGame();
function loadGame(){
  const base = blankSave();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.quests){
      const g = Object.assign(base, s);
      for (const k in blankSave().quests) if (!(k in g.quests)) g.quests[k] = 'inactive';
      g.flags = Object.assign(blankSave().flags, g.flags || {});
      g.orbs  = Object.assign(blankSave().orbs,  g.orbs  || {});
      for (const k of ['boxes','chests','rocks','placed','picked']) g[k] = g[k] || {};
      return g;
    }
  } catch (e) {}
  return base;
}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function hasSave(){ try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

/* ---------- 4. items ---------- */
const ITEMS = {
  urchin:        { name: 'Sea Urchin',      icon: '🦔', art: 'spikeball' }, // drawn as a spiky ball
  shell:         { name: 'Shell',           icon: '🐚' },
  'blue-pearl':  { name: 'Blue Pearl',      icon: '🔵' },
  grabber:       { name: 'Grabber',         icon: '🧤' },
  'urchin-block':{ name: 'Sea Urchin Block', icon: '🧱', art: 'block' },    // crafted from sea urchins
  lantern:       { name: 'Lantern',         icon: '🏮' },                    // softens the night
  'flat-urchin': { name: 'Flat Urchin',     icon: '🫓', art: 'flat' },       // Sxco's press flattens a Sea Urchin
  'orb-card':    { name: 'Orb Card',        icon: '🎴' },                    // scan / feed to machines
  spyglass:      { name: 'Spyglass',        icon: '🔭' },
  battery:       { name: 'Battery',         icon: '🔋' },                    // some machines need one
  'urchin-fossil': { name: 'Urchin Fossil', icon: '🦴' },                    // the museum's top-shelf exhibit
  'cave-crystal':  { name: 'Cave Crystal',  icon: '🔮' },                    // Pip's, up in the Dirt-layer alcove
  kite:          { name: 'Kite',            icon: '🪁' },                    // Sandy's, on the secret cliff
};
function itemName(id){ return (ITEMS[id] && ITEMS[id].name) || id; }
// route an id to the bag or to a counter
function grant(id, n){
  n = n || 1;
  if (id === 'coin') G.coins += n;
  else if (id === 'gem') G.gems += n;
  else if (id === 'gold') G.gold += n;
  else return invAdd(id, n);
  persist();
  return n;
}

// crafting-table recipes  (have()/takeCost() route gems+coins to their own counters)
const RECIPES = [
  { id: 'urchin-block', name: 'Sea Urchin Block', out: 1, cost: [['urchin', 5]],
    blurb: 'A sturdy spiky block, packed from sea urchins.' },
  { id: 'lantern', name: 'Lantern', out: 1, cost: [['shell', 4], ['gem', 1]],
    blurb: 'Carry it to see better after dark.' },
  { id: 'orb-card', name: 'Orb Card', out: 1, cost: [['flat-urchin', 1], ['coin', 2]],
    blurb: 'Seal a Flat Urchin in a card. Scan it at an Orb Scanner.' },
];
function have(id){ return id === 'gem' ? G.gems : id === 'coin' ? G.coins : invCount(id); }
function takeCost(id, n){ if (id === 'gem') G.gems -= n; else if (id === 'coin') G.coins -= n; else invRemove(id, n); }
function canCraft(r){ return r.cost.every(([id, n]) => have(id) >= n); }
function craftRecipe(rid){
  const r = RECIPES.find(x => x.id === rid);
  if (!r || !canCraft(r)){ toast("Not enough materials."); return false; }
  r.cost.forEach(([id, n]) => takeCost(id, n));
  invAdd(r.id, r.out);
  persist();
  toast('Crafted: ' + r.name);
  return true;
}
function invCount(id){ let n = 0; for (const s of G.inv) if (s.id === id) n += s.qty; return n; }
function invAdd(id, n){
  let left = n;
  for (const s of G.inv) if (s.id === id && s.qty < 20){ const a = Math.min(20 - s.qty, left); s.qty += a; left -= a; }
  while (left > 0 && G.inv.length < 10){ const a = Math.min(20, left); G.inv.push({ id, qty: a }); left -= a; }
  if (left > 0) toast('Bag full!');
  persist();
  return n - left;
}
function invRemove(id, n){
  let left = n;
  for (let i = G.inv.length - 1; i >= 0 && left > 0; i--){
    const s = G.inv[i];
    if (s.id === id){ const t = Math.min(s.qty, left); s.qty -= t; left -= t; if (s.qty === 0) G.inv.splice(i, 1); }
  }
  persist();
  return n - left;
}

/* ---------- 5. worlds ----------------------------------------------------
   A world is plain data. To build a new layer, copy one of these objects,
   give it a key in WORLDS, and point a drop-hole at it.
     solids   : {x,y,w,h, kind}   kind = ground|sand|ledge|coral|green|wall
                kind:'green' bits stay hidden until the elevator reaches the top
     elevators: {x,y,w,h, top, bottom, period}   moves bottom->top->bottom
     boxes    : {x,y,w,h, gives, n}   bonk from below or press E -> pops open
     pickups  : {x,y, id}             floating collectible, taken once
     holes    : {x,y,w,h, target, arrival}   fall in -> go to another world
     npcs     : {x,y (feet), name, color, shape, quest?, talk?, action?, patrol?}
                patrol: px -> the NPC paces back and forth that far (a "moving" NPC)
     tables   : {x,y (feet)}          crafting table - press E to craft
     doors    : {x,y (feet)}          press E to hop to another door in the same world
                {x,y, target, arrival} -> a door into another world instead
     chests   : {x,y (feet)}          press E once -> Cokco-coins, rarely a gem
     gemBoxes : {x,y (feet)}          rare - press E once -> always gems
     machines : {x,y (feet), kind}    kind:'scanner' -> scan an Orb Card for a new orb
     solids kind:'rock'  -> only hammer-form Cokco can smash it (press E)
     solids kind:'tight' -> only slime-form Cokco fits through
   --------------------------------------------------------------------- */
const WORLDS = {

  home: {
    name: 'Home', bg: 'home', w: 2800, h: 1050,
    gravity: 1300, jump: -430, maxFall: 900,
    arrivals: { spawn: {x:120, y:690}, fromOcean: {x:160, y:-50, vy:220},
                fromFlatten: {x:150, y:690}, fromBeach: {x:2690, y:690} },
    solids: [
      { x:0,    y:770, w:1922, h:280, kind:'ground' },
      { x:2040, y:770, w:760,  h:280, kind:'ground' },

/* day/night follows the player's real clock: full day 07-19, full night 21-05 */
function dayFactor(){
  const d = new Date();
  const h = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  if (h >= 7 && h < 19) return 1;
  if (h >= 5 && h < 7)  return (h - 5) / 2;
  if (h >= 19 && h < 21) return 1 - (h - 19) / 2;
  return 0;
}
function nightAlpha(){
  const base = (1 - dayFactor()) * 0.60;
  return invCount('lantern') > 0 ? base * 0.4 : base;
}

const P = {
  x:0, y:0, w:CFG.cokco.w, h:CFG.cokco.h, vx:0, vy:0,
  face:1, walk:0, squash:0,
  grounded:false, groundRef:null, headBonk:null, jumping:false,
  jumpBuf:0, coyote:0, airTime:0,
  form:'normal', floatT:0, touchWall:0,   // orb form, swim-float timer, wall-contact side (for snake climb)
};

// Cokco-orb forms.  slime is short & narrow (fits `tight` gaps); hammer is chunky.
const FORMS = {
  normal: { w:26, h:34, speed:190, jump:1   },
  slime:  { w:20, h:18, speed:150, jump:0.55 },
  hammer: { w:30, h:34, speed:170, jump:0.9  },
  snake:  { w:16, h:30, speed:150, jump:0.7  },   // long & thin - climbs walls
  fly:    { w:26, h:30, speed:210, jump:1    },   // hold up to fly
};
const ORB_ORDER = ['slime', 'hammer', 'snake', 'fly'];
function setForm(f){
  if (P.form === f) return true;
  const prev = P.form, nf = FORMS[f], pf = FORMS[prev];
  const box = { x: P.x + (pf.w - nf.w) / 2, y: P.y + (pf.h - nf.h), w: nf.w, h: nf.h };
  P.form = f;                                   // set first, so worldSolids() filters for the new form
  if (worldSolids().some(s => aabb(box, s))){   // new body would be stuck in a wall -> abort
    P.form = prev;
    toast('No room to change here!');
    return false;
  }
  P.x = box.x; P.y = box.y; P.w = nf.w; P.h = nf.h;
  return true;
}
function cycleForm(){
  const avail = ['normal', ...ORB_ORDER.filter(o => G.orbs[o])];
  if (avail.length < 2){ toast('No Cokco-orbs yet.'); return; }
  const next = avail[(avail.indexOf(P.form) + 1) % avail.length];
  if (setForm(next)) toast(next === 'normal' ? 'Back to normal.' : 'Form: ' + next.toUpperCase());
}

function toast(m){ toasts.push({ m, t: 2.6 }); }

/* ---------- 7. physics ---------- */
function worldSolids(){
  const s = [];
  for (const r of world.solids){
    if (r.kind === 'green' && !G.flags.greenStairs) continue;
    if (r.kind === 'tight' && P.form === 'slime') continue;          // slime oozes through
    if (r.kind === 'rock' && G.rocks[r.rockKey]) continue;           // already smashed
    s.push(r);
  }
  for (const e of world.elevators) s.push(e);
  world.boxes.forEach((b, i) => { if (!G.boxes[world.key + ':' + i]) s.push(b); });
  for (const b of (G.placed[world.key] || [])) s.push({ x: b.x, y: b.y, w: 24, h: 24, kind: 'placed' });
  return s;
}
function moveX(solids){
  P.x += P.vx * dt;
  let wall = 0;
  for (const s of solids){
    if (!aabb(P, s)) continue;
    const overlapY = (P.y + P.h) - s.y;            // how far Cokco's feet sit below this ledge's top
    if (P.vx !== 0 && overlapY > 0 && overlapY <= CFG.step){
      const lifted = { x:P.x, y:s.y - P.h, w:P.w, h:P.h };
      if (!solids.some(o => o !== s && aabb(lifted, o))){ P.y = s.y - P.h; continue; } // step up (stairs)
    }
    wall = P.vx > 0 ? 1 : P.vx < 0 ? -1 : P.face;
    P.x = P.vx > 0 ? s.x - P.w : s.x + s.w;
    P.vx = 0;
  }
  P.touchWall = wall;                              // which side a wall is on (0 = none) - snake climbs it
  P.x = clamp(P.x, 0, world.w - P.w);
}
function moveY(solids){
  P.y += P.vy * dt;
  P.grounded = false; P.groundRef = null; P.headBonk = null;
  for (const s of solids){
    if (!aabb(P, s)) continue;
    if (P.vy > 0){ P.y = s.y - P.h; P.vy = 0; P.grounded = true; P.groundRef = s; P.jumping = false; }
    else if (P.vy < 0){ P.y = s.y + s.h; P.vy = 0; P.headBonk = s; }
  }
}
function placePlayer(pt){
  P.x = pt.x; P.y = pt.y; P.vx = 0; P.vy = pt.vy || 0;
  P.grounded = false; P.groundRef = null; P.jumping = false;
  cam.x = clamp(P.x - VW/2, 0, Math.max(0, world.w - VW));
  cam.y = clamp(P.y - VH/2, 0, Math.max(0, world.h - VH));
}

/* ---------- world loading + travel ---------- */
function loadWorld(id){
  world = WORLDS[id];
  world.key = id;
  for (const k of ['solids','elevators','boxes','pickups','holes','npcs','tables','doors','chests','gemBoxes','machines','orbChests'])
    world[k] = world[k] || [];
  world.boxes.forEach((b, i) => { b.boxKey = id + ':' + i; b.__box = true; b.gives = b.gives || 'urchin'; b.n = b.n || 3; });
  let ri = 0; world.solids.forEach(s => { if (s.kind === 'rock') s.rockKey = id + ':r' + (ri++); });
  world.doors.filter(d => !d.target).forEach((d, i) => { d.num = i + 1; });   // 1..N labels for the chooser
  world.npcs.forEach(n => { n.baseX = n.x; });          // patrol origin
  for (const e of world.elevators) e.t = 0;
  // if the current orb form got locked (fresh game / reset), fall back to normal
  if (P.form !== 'normal' && !G.orbs[P.form]){ P.form = 'normal'; P.w = FORMS.normal.w; P.h = FORMS.normal.h; }
  P.floatT = 0;
  loose.length = 0;
  makeBubbles(world);
  G.world = id;
  G.flags['visited_' + id] = true;
  persist();
}
function travel(target, arrival){
  trans = { target, arrival, t: 0, swapped: false };
  mode = 'transition';
}
function updateTransition(){
  trans.t += dt;
  if (trans.t >= 0.32 && !trans.swapped){
    loadWorld(trans.target);
    placePlayer(world.arrivals[trans.arrival] || world.arrivals.spawn);
    G.px = P.x; G.py = P.y; persist();
    trans.swapped = true;
  }
  if (trans.t >= 0.64){ trans = null; mode = 'play'; }
}

/* ---------- 8. play update ---------- */
function updatePlay(){
  const w = world;

  // elevators: bottom -> top -> bottom on a `period`-second climb each way
  for (const e of w.elevators){
    e.t += dt;
    const ph = (e.t % (2 * e.period)) / e.period;   // 0..2
    const f = ph < 1 ? ph : 2 - ph;                 // 0..1..0
    const prev = e.y;
    e.y = lerp(e.bottom, e.top, f);
    e.dy = e.y - prev;
    if (e.y <= e.top + 2 && !G.flags.greenStairs){
      G.flags.greenStairs = true; persist();
      toast('The elevator reached the top - green stairs appeared!');
    }
  }

  // moving NPCs pace around their start point
  for (const n of w.npcs) if (n.patrol) n.x = n.baseX + Math.sin(T * 0.7 + n.baseX) * n.patrol;

  // change Cokco-orb form
  if (key('KeyQ')) cycleForm();

  // carried by the elevator you're standing on
  if (P.groundRef && P.groundRef.dy !== undefined && P.grounded) P.y += P.groundRef.dy;

  const FM = FORMS[P.form];

  // walk
  const dir = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  const swimming = w.floaty && !P.grounded;      // floaty, off the sand -> water handling
  if (dir !== 0){ P.vx += dir * (swimming ? 1100 : 1600) * dt; P.face = dir; }
  const drag = P.grounded ? 1800 : swimming ? 300 : 700;
  if (dir === 0 || Math.sign(dir) !== Math.sign(P.vx)){
    const s = Math.sign(P.vx);
    P.vx -= s * drag * dt;
    if (Math.sign(P.vx) !== s) P.vx = 0;
  }
  P.vx = clamp(P.vx, -FM.speed * (swimming ? 1.15 : 1), FM.speed * (swimming ? 1.15 : 1));
  if (Math.abs(P.vx) > 6) P.walk += dt * 12; else P.walk = 0;

  const climbing = P.form === 'snake' && P.touchWall !== 0 &&
    (held('jump') || held('down') || held('left') || held('right'));

  if (climbing){
    // snake form clings to a wall: hold up (↑/W) to climb, hold down to descend,
    // hold AWAY from the wall to step off it, otherwise hang on.
    P.vy = held('jump') ? -150 : held('down') ? 150 : 0;
    const away = P.touchWall > 0 ? 'left' : 'right';
    P.vx = held(away) ? -P.touchWall * FM.speed : P.touchWall * 40;
    P.jumping = false;
  } else if (P.form === 'fly'){
    // flying: hold up (↑/W/Space) to rise, otherwise drift gently down
    if (held('jump')) P.vy += (-230 - P.vy) * Math.min(1, dt * 7);
    else P.vy += w.gravity * dt * 0.28;
    P.vy = clamp(P.vy, -260, 210);
  } else if (w.floaty){
    // swimming: each press of up is a ~0.5s kick upward - keep tapping to climb
    if (tapped('jump')) P.floatT = 0.5;
    P.floatT = Math.max(0, P.floatT - dt);
    if (P.floatT > 0) P.vy += (-165 - P.vy) * Math.min(1, dt * 9);   // upward kick
    else { P.vy += w.gravity * dt * 0.55; if (P.vy > 300) P.vy = 300; }
  } else {
    // jump with coyote-time + input buffer, and variable height
    if (tapped('jump')) P.jumpBuf = CFG.buffer;
    P.jumpBuf -= dt;
    P.coyote = P.grounded ? CFG.coyote : P.coyote - dt;
    if (P.jumpBuf > 0 && P.coyote > 0){
      P.vy = w.jump * FM.jump; P.jumpBuf = 0; P.coyote = 0; P.grounded = false; P.jumping = true;
    }
    if (P.jumping && !held('jump') && P.vy < 0){ P.vy *= 0.5; P.jumping = false; }
    P.vy += w.gravity * dt;
    P.vy = Math.min(P.vy, w.maxFall);
  }

  const solids = worldSolids();
  moveX(solids);
  moveY(solids);

  if (P.headBonk && P.headBonk.__box) openBox(P.headBonk);

  // squash on landing
  if (P.grounded && P.airTime > 0.16) P.squash = 1;
  P.airTime = P.grounded ? 0 : P.airTime + dt;
  P.squash = Math.max(0, P.squash - dt * 4);

  // fell out of the world
  if (P.y > w.h + 300) placePlayer(w.arrivals.spawn);

  // loose urchins from popped boxes
  for (let i = loose.length - 1; i >= 0; i--){
    const l = loose[i];
    l.life -= dt;
    if (!l.grounded){
      l.vy += w.gravity * dt;
      l.x += l.vx * dt; l.y += l.vy * dt;
      for (const s of solids){
        if (l.x > s.x && l.x < s.x + s.w && l.vy > 0 && l.y >= s.y - 2 && l.y < s.y + 18){
          l.y = s.y - 2; l.vy *= -0.35; l.vx *= 0.6;
          if (Math.abs(l.vy) < 30){ l.vy = 0; l.grounded = true; l.vx = 0; }
        }
      }
    }
    if (!l.debris && aabb(P, { x:l.x - 10, y:l.y - 16, w:20, h:22 })){
      const got = invAdd(l.id, 1);
      if (got) toast('+1 ' + ITEMS[l.id].name);
      loose.splice(i, 1); continue;
    }
    if (l.life <= 0 || l.y > w.h + 100) loose.splice(i, 1);
  }

  // floor pickups  (coin/gem go to their counters, everything else to the bag)
  w.pickups.forEach((p, i) => {
    const k = 'pk:' + w.key + ':' + i;
    if (G.picked[k]) return;
    if (aabb(P, { x:p.x - 12, y:p.y - 12, w:24, h:24 })){
      G.picked[k] = true;
      if (p.id === 'gem'){ G.gems += (p.n || 2); toast('+' + (p.n || 2) + ' 💎'); }
      else if (p.id === 'coin'){ G.coins += (p.n || 5); toast('+' + (p.n || 5) + ' 🪙'); }
      else { const got = invAdd(p.id, 1); if (got) toast('Found: ' + ITEMS[p.id].name); }
      persist();
    }
  });

  // what's in reach?
  const cxp = P.x + P.w/2, fyp = P.y + P.h;
  const near = (ox, oy, dx, dy) => Math.abs(cxp - ox) < dx && Math.abs(fyp - oy) < dy;
  let npcNear = null, boxNear = null, holeNear = null, tableNear = null, doorNear = null, chestNear = null,
      machineNear = null, rockNear = null;
  for (const n of w.npcs) if (near(n.x, n.y, n.patrol ? 72 : 46, 74)) npcNear = n;
  for (const t of w.tables) if (near(t.x, t.y, 44, 76)) tableNear = t;
  for (const d of w.doors) if (near(d.x, d.y, 34, 76)) doorNear = d;
  for (const m of w.machines) if (near(m.x, m.y, 40, 76)) machineNear = m;
  for (const s of w.solids){
    if (s.kind === 'rock' && !G.rocks[s.rockKey] &&
        Math.abs(cxp - (s.x + s.w/2)) < s.w/2 + 26 && Math.abs((P.y + P.h/2) - (s.y + s.h/2)) < s.h/2 + 24) rockNear = s;
  }
  w.chests.forEach((c, i) => { const kk = w.key + ':c' + i; if (!G.chests[kk] && near(c.x, c.y, 38, 64)) chestNear = { c, kk, gem: false }; });
  w.gemBoxes.forEach((c, i) => { const kk = w.key + ':g' + i; if (!G.chests[kk] && near(c.x, c.y, 38, 64)) chestNear = { c, kk, gem: true }; });
  w.orbChests.forEach((c, i) => { const kk = w.key + ':o' + i; if (!G.chests[kk] && near(c.x, c.y, 40, 66)) chestNear = { c, kk, orbId: c.orb }; });
  w.boxes.forEach((b, i) => {
    if (G.boxes[w.key + ':' + i]) return;
    if (Math.abs(cxp - (b.x + b.w/2)) < 40 && Math.abs((P.y + P.h/2) - (b.y + b.h/2)) < 44) boxNear = b;
  });
  for (const h of w.holes){
    if (P.grounded && Math.abs(cxp - (h.x + h.w/2)) < 110) holeNear = h;
  }

  const machineHint = machineNear
    ? (machineNear.kind === 'scanner' ? 'E — scan an Orb Card'
       : 'E — feed a Cokco Card' + (machineNear.needsBattery ? ' + a Battery' : ''))
    : null;
  hintText = npcNear ? 'E — talk to ' + npcNear.name
           : rockNear ? (P.form === 'hammer' ? 'E — SMASH the boulder!' : 'A tough boulder. Only a hammer could break it.')
           : machineHint ? machineHint
           : tableNear ? 'E — use the crafting table'
           : doorNear ? (doorNear.target ? 'E — enter the ' + (doorNear.label || 'door') : 'E — go through the door')
           : chestNear ? 'E — open the ' + (chestNear.orbId ? 'orb-chest' : chestNear.gem ? 'gem box' : 'chest')
           : boxNear ? 'E — open the box'
           : holeNear ? '↓ walk into the hole to drop to ' + WORLDS[holeNear.target].name
           : (P.form === 'snake') ? 'press into a wall + hold ↑ to climb'
           : (invCount('urchin-block') || (G.placed[w.key] || []).length) ? 'B place/take a block · Esc menu · I bag'
           : (G.orbs.slime || G.orbs.hammer || G.orbs.snake || G.orbs.fly) ? 'Q change form · Esc menu · I bag'
           : 'Esc menu · I bag · J problems';

  if (key('KeyB')) toggleBlock();

  if (key('KeyE', 'Enter')){
    if (npcNear){ talkTo(npcNear); return; }
    if (rockNear && P.form === 'hammer'){ smashRock(rockNear); return; }
    if (machineNear){ useMachine(machineNear); return; }
    if (tableNear){ openPanel('craft'); return; }
    if (doorNear){ openDoor(doorNear); return; }
    if (chestNear){ openChest(chestNear); return; }
    if (boxNear){ openBox(boxNear); }
  }

  // drop-holes
  for (const h of w.holes) if (aabb(P, h)) { travel(h.target, h.arrival); return; }

  // camera
  cam.x = clamp(lerp(cam.x, P.x + P.w/2 - VW/2, 0.12), 0, Math.max(0, world.w - VW));
  cam.y = clamp(lerp(cam.y, P.y + P.h/2 - VH * 0.58, 0.12), 0, Math.max(0, world.h - VH));

  // autosave position now and then
  saveTick += dt;
  if (saveTick > 2){ saveTick = 0; G.px = P.x; G.py = P.y; G.world = w.key; persist(); }
}

function openBox(b){
  if (G.boxes[b.boxKey]) return;
  G.boxes[b.boxKey] = true;
  persist();
  for (let i = 0; i < b.n; i++){
    loose.push({ x:b.x + b.w/2, y:b.y + 4, vx:rand(-90, 90), vy:rand(-260, -150), id:b.gives, life:9, grounded:false });
  }
  toast('The box pops open!');
}

function openChest(o){
  if (G.chests[o.kk]) return;
  G.chests[o.kk] = true;
  if (o.orbId){
    G.orbs[o.orbId] = true; persist();
    toast(o.orbId.toUpperCase() + ' ORB unlocked!  Press Q to change form.');
    return;
  }
  if (o.gem){
    const n = 1 + (chance(0.4) ? 1 : 0);
    G.gems += n; toast('Gem box!  +' + n + ' 💎');
  } else if (chance(0.10)){
    G.gems += 1; toast('A gem in the chest!  +1 💎');
  } else if (chance(0.12)){
    invAdd('battery', 1); toast('A Battery in the chest!  🔋');
  } else {
    const n = 3 + Math.floor(rand(0, 6));
    G.coins += n; toast('+' + n + ' Cokco-Coins 🪙');
  }
  persist();
}

// doors move Cokco between doors in the SAME world (or into another world if `target`)
function openDoor(d){
  if (d.target){ travel(d.target, d.arrival || 'spawn'); return; }
  const others = world.doors.filter(x => x !== d && !x.target);
  if (!others.length){ toast("This door won't budge."); return; }
  if (others.length === 1){ doorWarp(others[0]); return; }
  doorChoices = others;
  openPanel('door');
}
function doorWarp(d){
  placePlayer({ x: d.x - P.w/2, y: d.y - P.h - 2 });
  fx = 1;
}

function smashRock(s){
  if (G.rocks[s.rockKey]) return;
  G.rocks[s.rockKey] = true; persist();
  for (let i = 0; i < 9; i++)
    loose.push({ x:s.x + s.w/2, y:s.y + s.h/2, vx:rand(-170, 170), vy:rand(-240, -50), debris:true, life:0.9, grounded:false });
  toast('CRACK! The boulder shatters.');
}

function useMachine(m){
  if (m.kind === 'scanner'){
    if (invCount('orb-card') < 1){ toast('The scanner needs a loaded Orb Card.'); return; }
    invRemove('orb-card', 1);
    if (!G.orbs.slime){ G.orbs.slime = true; toast('SLIME ORB unlocked!  Press Q to change form.'); }
    else if (!G.orbs.hammer){ G.orbs.hammer = true; toast('HAMMER ORB unlocked!  Press Q to change form.'); }
    else toast('The scanner hums - you already have every orb it knows.');
    persist();
    return;
  }
  // gacha: feed a Cokco Card (+ a Battery if this one needs one) -> a random item
  if (invCount('orb-card') < 1){ toast('This machine needs a Cokco Card (an Orb Card).'); return; }
  if (m.needsBattery && invCount('battery') < 1){ toast('This machine also needs a Battery.'); return; }
  invRemove('orb-card', 1);
  if (m.needsBattery) invRemove('battery', 1);
  const prize = weightedPick([
    ['urchin', 5], ['shell', 5], ['urchin-block', 3], ['battery', 3],
    ['coin', 4], ['lantern', 1], ['gem', 1], ['blue-pearl', 1],
  ]);
  grant(prize, prize === 'coin' ? 2 + Math.floor(rand(0, 5)) : 1);
  toast('The machine clunks...  you got: ' + itemName(prize) + '!');
  persist();
}
function weightedPick(pairs){
  let total = 0; for (const [, w] of pairs) total += w;
  let r = Math.random() * total;
  for (const [id, w] of pairs){ if ((r -= w) < 0) return id; }
  return pairs[0][0];
}

// place / pick up Sea Urchin Blocks (press B)
function toggleBlock(){
  const list = G.placed[world.key] || (G.placed[world.key] = []);
  const G24 = 24;
  const fx0 = P.x + P.w / 2 + P.face * (P.w / 2 + 26);   // a clear step in front of Cokco
  const gx = Math.round((fx0 - G24 / 2) / G24) * G24;
  const gy = Math.round((P.y + P.h - G24) / G24) * G24;  // block sits at Cokco's foot level
  const hit = list.findIndex(b => Math.abs(b.x - gx) < 20 && Math.abs(b.y - gy) < 28);
  if (hit >= 0){
    list.splice(hit, 1); invAdd('urchin-block', 1); persist();
    toast('Picked up the block.');
    return;
  }
  if (invCount('urchin-block') < 1){ toast('No Sea Urchin Blocks. Craft one at a table.'); return; }
  const cell = { x: gx, y: gy, w: G24, h: G24 };
  if (aabb(P, cell)) cell.x += P.face * G24;             // nudge clear if the grid snapped onto Cokco
  if (aabb(P, cell)){ toast('No room to place a block here.'); return; }
  if (worldSolids().some(s => aabb(cell, s))){ toast("Something's in the way."); return; }
  invRemove('urchin-block', 1); list.push({ x: cell.x, y: cell.y }); persist();
  toast('Block placed.  Press B by it to pick it up.');
}

// shops
let shopNPC = null, mineNPC = null;
function buyFromShop(i){
  const s = shopNPC.stock[i];
  if (G.coins < s.cost){ toast('Not enough Cokco-coins.'); return; }
  G.coins -= s.cost;
  grant(s.id, 1);
  toast('Bought: ' + itemName(s.id) + '  (-' + s.cost + ' 🪙)');
  persist();
}
function goMining(){
  if (G.coins < mineNPC.cost){ toast('Mining costs ' + mineNPC.cost + ' Cokco-coins.'); return; }
  G.coins -= mineNPC.cost;
  const g = 1 + Math.floor(rand(0, 3));
  G.gold += g;
  let msg = '*dig dig dig*  You mined ' + g + ' gold!';
  if (chance(0.18)){ G.gems += 1; msg += '  And struck a gem!'; }
  persist();
  toast(msg);
}

function flattenUrchin(){
  if (invCount('urchin') < 1){ toast('Bring Sxco a Sea Urchin first.'); return; }
  invRemove('urchin', 1); invAdd('flat-urchin', 1); persist();
  toast('Sxco presses it flat.  +1 Flat Urchin');
}

/* per-quest hooks: onStart runs when accepted, ready() gates the turn-in, reward() pays out */
const QUEST_HOOKS = {
  hammer: { onStart: () => { G.orbs.hammer = true; },
            ready: () => !!G.rocks['home:r0'], reward: () => { G.coins += 12; } },
  swim:   { ready: () => invCount('spyglass') >= 1,
            reward: () => { invRemove('spyglass', 1); invAdd('shell', 5); } },
  slime:  { ready: () => !!G.picked['pk:ocean:0'],
            reward: () => { invAdd('shell', 4); } },
  block:  { ready: () => invCount('urchin-fossil') >= 1,
            reward: () => { invRemove('urchin-fossil', 1); invAdd('shell', 4); G.coins += 6; } },
  climb:  { ready: () => invCount('kite') >= 1,
            reward: () => { invRemove('kite', 1); G.coins += 10; G.orbs.fly = true;
                            toast('FLYING ORB unlocked!  Press Q to fly.'); } },
  dirtfly:{ ready: () => invCount('cave-crystal') >= 1,
            reward: () => { invRemove('cave-crystal', 1); G.coins += 8; invAdd('battery', 1); } },
};

/* ---------- 9. dialogue ---------- */
function talkTo(n){
  if (n.quest){
    const q = QUESTS[n.quest], st = G.quests[n.quest], hk = QUEST_HOOKS[n.quest] || {};
    if (st === 'inactive'){
      dialogue = { who:n.name, lines:q.offer.slice(), i:0, end:() => {
        G.quests[n.quest] = 'active';
        if (hk.onStart) hk.onStart();
        persist(); toast('New problem: ' + q.title);
        if (n.quest === 'hammer') toast('HAMMER ORB unlocked!  Press Q to change form.');
      }};
    } else if (st === 'active' && n.quest === 'craft' && invCount('urchin') >= 3){
      dialogue = { who:n.name, lines:q.turnin.slice(), i:0, end:() => {
        invRemove('urchin', 3); invAdd('grabber', 1); G.flags.grabber = true;
        G.quests.craft = 'done'; persist(); toast('Crafted: Grabber'); checkAllSolved();
      }};
    } else if (st === 'active' && n.quest === 'pearl' && invCount('blue-pearl') >= 1){
      dialogue = { who:n.name, lines:q.turnin.slice(), i:0, end:() => {
        invRemove('blue-pearl', 1); invAdd('shell', 5);
        G.quests.pearl = 'done'; persist(); toast('+5 Shells'); checkAllSolved();
      }};
    } else if ((st === 'active' && n.quest === 'ocean' && G.flags.oceanCalm) || st === 'ready'){
      dialogue = { who:n.name, lines:q.turnin.slice(), i:0, end:() => {
        G.quests[n.quest] = 'done';
        if (n.quest === 'ocean') invAdd('shell', 3);
        persist(); toast('Problem solved: ' + q.title); checkAllSolved();
      }};
    } else if (st === 'active' && hk.ready && hk.ready()){
      dialogue = { who:n.name, lines:q.turnin.slice(), i:0, end:() => {
        G.quests[n.quest] = 'done';
        if (hk.reward) hk.reward();
        persist(); toast('Problem solved: ' + q.title); checkAllSolved();
      }};
    } else if (st === 'done'){
      dialogue = { who:n.name, lines:q.done.slice(), i:0, end:null };
    } else {
      dialogue = { who:n.name, lines:q.active.slice(), i:0, end:null };
    }
  } else if (n.action === 'shop'){
    shopNPC = n;
    openPanel('shop');
    return;
  } else if (n.action === 'mine'){
    mineNPC = n;
    const canPay = G.coins >= n.cost;
    dialogue = { who:n.name, i:0,
      lines: canPay
        ? ['Gold mine\'s that way. ' + n.cost + ' Cokco-coins for a dig - deal?', '*clink*  Right then...']
        : ['A dig costs ' + n.cost + ' Cokco-coins. Come back when your pockets jingle.'],
      end: canPay ? goMining : null };
  } else if (n.action === 'flatten'){
    const haveCard = invCount('orb-card') >= 1, haveFlat = invCount('flat-urchin') >= 1, haveUrchin = invCount('urchin') >= 1;
    const lines = haveCard
      ? ["That card's loaded. Take it to an Orb Scanner - there's one in the corner here, another down in the Ocean layer."]
      : haveFlat
        ? ["You've a Flat Urchin already. Seal it into an Orb Card at a crafting table (needs 2 Cokco-coins for the card)."]
        : haveUrchin
          ? ["Sxco's the name, flattening's my game.", "One Sea Urchin - in the press it goes...", "*KA-CHUNK!*  There: one Flat Urchin. Card it up, then scan the card."]
          : ["Sxco's the name, flattening's my game.", "Bring me a Sea Urchin and my machine will press it flat."];
    dialogue = { who:n.name, lines, i:0,
      end: (!haveCard && !haveFlat && haveUrchin) ? flattenUrchin : null };
  } else {
    dialogue = { who:n.name, lines:(n.talk || ['...']).slice(), i:0,
      end: n.action === 'minigame' ? () => startMinigame() : null };
  }
  mode = 'dialogue';
}
function advanceDialogue(){
  dialogue.i++;
  if (dialogue.i >= dialogue.lines.length){
    const f = dialogue.end; dialogue = null; mode = 'play';
    if (f) f();
  }
}
function checkAllSolved(){
  if (Object.values(G.quests).every(s => s === 'done') && !G.flags.allSolvedSeen){
    G.flags.allSolvedSeen = true; persist();
    toast('Every known problem solved! Keep exploring - more will sprout.');
  }
}

/* ---------- 10. sea-urchin catching minigame ---------- */
let mgBub = [];
function startMinigame(){
  MG = {
    time: G.flags.grabber ? 40 : 34,
    target: 8,
    score: 0, banked: 0, blue: false,
    cap: G.mgCap, basket: [], bx: VW / 2,
    urchins: [], spawn: 0, plusIn: 6,
    result: null, endT: 0,
  };
  mgBub = Array.from({ length: 40 }, () => ({ x:rand(0, VW), y:rand(0, VH), r:rand(2, 6), s:rand(20, 55) }));
  mode = 'minigame';
}
function basketW(){ return G.flags.grabber ? 98 : 78; }
function bucketX(){ return 70; }
function basketY(){ return VH - 120; }
function updateMinigame(){
  for (const b of mgBub){ b.y -= b.s * dt; if (b.y < -10){ b.y = VH + 10; b.x = rand(0, VW); } }

  if (MG.result){
    MG.endT -= dt;
    if (MG.endT <= 0) finishMinigame();
    return;
  }

  MG.time -= dt;
  const dir = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  MG.bx = clamp(MG.bx + dir * 300 * dt, 90, VW - 60);

  MG.spawn -= dt;
  if (MG.spawn <= 0){
    MG.spawn = rand(0.45, 0.95);
    const type = chance(0.08) ? 'blue' : chance(0.24) ? 'x2' : 'norm';
    MG.urchins.push({ x:rand(110, VW - 90), y:VH - 50, vx:rand(-35, 35), vy:rand(-115, -70),
      r:type === 'x2' ? 16 : 12, type });
  }
  MG.plusIn -= dt;
  if (MG.plusIn <= 0 && MG.cap < 10){
    MG.plusIn = rand(6, 11);
    MG.urchins.push({ x:rand(110, VW - 90), y:VH - 50, vx:rand(-25, 25), vy:-95, r:13, type:'plus' });
  }

  const bw = basketW(), bx = MG.bx;
  const box = { x:bx - bw/2, y:basketY() - 16, w:bw, h:30 };
  for (let i = MG.urchins.length - 1; i >= 0; i--){
    const u = MG.urchins[i];
    u.x += u.vx * dt; u.y += u.vy * dt; u.vx *= 0.999;
    if (u.y < -30){ MG.urchins.splice(i, 1); continue; }
    if (aabb({ x:u.x - u.r, y:u.y - u.r, w:u.r * 2, h:u.r * 2 }, box)){
      if (u.type === 'plus'){
        MG.cap = Math.min(10, MG.cap + 2); G.mgCap = MG.cap; persist();
        toast('Basket +2  (now ' + MG.cap + ')');
        MG.urchins.splice(i, 1);
      } else if (MG.basket.length < MG.cap){
        MG.basket.push(u.type);
        if (u.type === 'blue') MG.blue = true;
        MG.urchins.splice(i, 1);
      } else {
        u.vy = 60; // basket full - it bounces away, go bank some
      }
    }
  }

  // bank at the bucket
  if (MG.bx < bucketX() + 55 && MG.basket.length){
    for (const t of MG.basket) MG.score += t === 'blue' ? 5 : t === 'x2' ? 2 : 1;
    MG.banked += MG.basket.length;
    MG.basket = [];
    toast('Banked!');
  }

  if (MG.score >= MG.target){ MG.result = 'win'; MG.endT = 1.8; }
  else if (MG.time <= 0){ MG.result = MG.score >= MG.target ? 'win' : 'lose'; MG.endT = 1.8; }

  if (key('Escape')){ MG = null; mode = 'play'; }
}
function finishMinigame(){
  if (MG.result === 'win'){
    const got = invAdd('urchin', Math.min(MG.banked, 40));
    let msg = 'You calmed the water!  +' + got + ' urchin' + (got === 1 ? '' : 's');
    if (MG.blue){ invAdd('blue-pearl', 1); msg += '  &  a Blue Pearl!'; }
    if (G.quests.ocean === 'active') G.quests.ocean = 'ready';
    G.flags.oceanCalm = true;
    persist();
    toast(msg);
  } else {
    toast('The urchins scattered! Talk to Clawdia to try again.');
  }
  MG = null; mode = 'play';
}

// Cokco, drawn to match Avery's picture: one round body, the top ~40% filled a
// flat grey (not hair) with a divider line, two big oval eyes, straight stick
// arms angled up-and-out, and two short splayed legs.
function drawCokco(x, y, faceEyes, walk, squash, form){
  form = form || 'normal';
  if (form === 'slime'){
    const w = FORMS.slime.w, h = FORMS.slime.h, cx = x + w/2, cy = y + h/2;
    const wob = Math.sin(T * 7) * 1.4;
    ctx.save();
    ctx.fillStyle = 'rgba(96,204,120,.9)'; ctx.strokeStyle = '#2f8f47'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.quadraticCurveTo(x - 3, cy, cx - 3, y + 2 + wob);
    ctx.quadraticCurveTo(cx, y - 3 - wob, cx + 3, y + 2 + wob);
    ctx.quadraticCurveTo(x + w + 3, cy, x + w, y + h);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(cx - 3, cy - 2, 3, 2, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#20303a';
    const ex = faceEyes * 1.6;
    ctx.beginPath(); ctx.arc(cx - 4 + ex, cy, 1.9, 0, 7); ctx.arc(cx + 4 + ex, cy, 1.9, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }
  if (form === 'hammer'){
    const w = FORMS.hammer.w, h = FORMS.hammer.h, cx = x + w/2, r = 13, by = y + r + 4;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // stony legs
    ctx.strokeStyle = '#4a4640'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 6, by + r * 0.8); ctx.lineTo(cx - 8, y + h);
    ctx.moveTo(cx + 6, by + r * 0.8); ctx.lineTo(cx + 8, y + h);
    ctx.stroke();
    // the mallet, over the right shoulder
    ctx.strokeStyle = '#7a5a34'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx + 4, by + 2); ctx.lineTo(cx + 20, by - 20); ctx.stroke();
    ctx.fillStyle = '#8a8f98'; ctx.strokeStyle = '#5b6069'; ctx.lineWidth = 2;
    ctx.save(); ctx.translate(cx + 22, by - 23); ctx.rotate(-0.7);
    ctx.fillRect(-13, -9, 26, 18); ctx.strokeRect(-13, -9, 26, 18); ctx.restore();
    // stone body
    ctx.fillStyle = '#9a938a'; ctx.beginPath(); ctx.arc(cx, by, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#20242b'; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = '#6f6a63'; ctx.beginPath(); ctx.arc(cx, by, r, Math.PI * 1.05, Math.PI * 1.95); ctx.arc(cx, by - r * 0.18, r, 0, Math.PI, true); ctx.fill();
    ctx.fillStyle = '#242222';
    const ex = faceEyes * 2;
    ctx.beginPath(); ctx.ellipse(cx - 5.4 + ex, by + 1, 2.9, 3.4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 5.4 + ex, by + 1, 2.9, 3.4, 0, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }
  if (form === 'snake'){
    const w = FORMS.snake.w, h = FORMS.snake.h, cx = x + w/2;
    ctx.save();
    ctx.fillStyle = '#5fae35'; ctx.strokeStyle = '#3c7a24'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++){
      const sy = y + h - 5 - i * (h - 8) / 4;
      const sx = cx + Math.sin(T * 5 + i * 0.9) * 3;
      ctx.beginPath(); ctx.arc(sx, sy, 5.5 - i * 0.3, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#242222';
    const hx = cx + Math.sin(T * 5 + 3.6) * 3, hy = y + 2, ex = faceEyes * 1.6;
    ctx.beginPath(); ctx.arc(hx - 2 + ex, hy, 1.5, 0, 7); ctx.arc(hx + 2 + ex, hy, 1.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(hx + ex, hy + 2); ctx.lineTo(hx + ex + faceEyes * 4, hy + 5); ctx.stroke();
    ctx.restore();
    return;
  }
  if (form === 'fly'){
    const w = FORMS.fly.w, h = FORMS.fly.h, cx = x + w/2, r = 12, by = y + r + 6 + Math.sin(T * 3) * 2;
    const flap = Math.sin(T * 18) * 8;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.strokeStyle = '#b9c6d6'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(cx - r, by - 2, 10, 5, -0.5 + flap * 0.03, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx + r, by - 2, 10, 5, 0.5 - flap * 0.03, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = CFG.cokco.color;
    ctx.beginPath(); ctx.arc(cx, by, r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#20242b'; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.fillStyle = CFG.cokco.cap;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, by, r, 0, 7); ctx.clip();
    ctx.fillRect(cx - r - 1, by - r - 1, 2 * r + 2, r * 0.82); ctx.restore();
    ctx.fillStyle = '#242222';
    const ex = faceEyes * 2;
    ctx.beginPath(); ctx.ellipse(cx - 4.6 + ex, by + 1, 2.6, 3, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 4.6 + ex, by + 1, 2.6, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }
  const w = CFG.cokco.w, h = CFG.cokco.h, cx = x + w/2, r = w/2, by = y + r + 2;
  const sw = Math.sin(walk) * 3, aw = Math.sin(walk) * 2;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // limbs (drawn in world coords so the squash doesn't stretch them)
  ctx.strokeStyle = '#33302b'; ctx.lineWidth = 3;
  ctx.beginPath();
  // two short splayed legs
  ctx.moveTo(cx - r * 0.42, by + r * 0.82); ctx.lineTo(cx - r * 0.70 + sw, y + h);
  ctx.moveTo(cx + r * 0.42, by + r * 0.82); ctx.lineTo(cx + r * 0.70 - sw, y + h);
  // two arms, same length, at equal-and-opposite angles: right tilts up, left
  // tilts down by the same amount.
  const AL = 13, ca = 0.852, sa = 0.523;      // arm unit vector, ~31 deg off horizontal
  ctx.moveTo(cx + r * ca, by - r * sa); ctx.lineTo(cx + r * ca + AL * ca - aw, by - r * sa - AL * sa);
  ctx.moveTo(cx - r * ca, by + r * sa); ctx.lineTo(cx - r * ca - AL * ca + aw, by + r * sa + AL * sa);
  ctx.stroke();

  ctx.translate(cx, by);
  ctx.scale(1 - squash * 0.18, 1 + squash * 0.22);
  const dv = -r * 0.18, hw = Math.sqrt(r * r - dv * dv);

  ctx.fillStyle = CFG.cokco.color;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();

  ctx.save();                                   // grey top cap, clipped to the circle
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
  ctx.fillStyle = CFG.cokco.cap;
  ctx.fillRect(-r - 1, -r - 1, 2 * r + 2, dv + r + 1);
  ctx.restore();

  ctx.strokeStyle = '#20242b'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-hw, dv); ctx.lineTo(hw, dv); ctx.stroke();

  ctx.fillStyle = '#242222';
  const ex = faceEyes * 2;
  ctx.beginPath(); ctx.ellipse(-5.4 + ex, 0.8, 2.9, 3.4, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5.4 + ex, 0.8, 2.9, 3.4, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function marker(n){
  if (!n.quest) return n.action === 'minigame' ? '!' : '';
  const s = G.quests[n.quest];
  if (s === 'inactive' || s === 'ready') return '!';
  if (s === 'active'){
    const hk = QUEST_HOOKS[n.quest];
    if (hk && hk.ready && hk.ready()) return '!';
    if (n.quest === 'craft' && invCount('urchin') >= 3) return '!';
    if (n.quest === 'pearl' && invCount('blue-pearl') >= 1) return '!';
    if (n.quest === 'ocean' && G.flags.oceanCalm) return '!';
    return '…';
  }
  return '';
}
function drawCreature(n){

  } else if (n.shape === 'fish'){

  } else if (n.shape === 'rock'){
    ctx.fillStyle = n.color; ctx.strokeStyle = '#7a6a58'; ctx.lineWidth = 2;

  } else if (n.shape === 'sxco'){
    // Cokco-ish but with a press-machine helmet + a lever arm
    ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(x, y - 17, 13, 0, 7); ctx.fill();

    ctx.fillStyle = '#20242b'; ctx.beginPath(); ctx.arc(x - 4, y - 18, 1.9, 0, 7); ctx.arc(x + 4, y - 18, 1.9, 0, 7); ctx.fill();
  } else { // leaf

function mix(a, b, t){                    // lerp two "#rrggbb" strings -> "rgb(...)"
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const l = (sh) => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return 'rgb(' + l(16) + ',' + l(8) + ',' + l(0) + ')';
}
function label(g, x, y, text, col){
  g.font = '11px system-ui'; g.textAlign = 'center';
  const tw = g.measureText(text).width;
  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x - tw/2 - 5, y - 11, tw + 10, 15);
  g.fillStyle = col || '#fff'; g.fillText(text, x, y);
}
function drawSpikeBall(g, cx, cy, r, col, spin){
  g.save();
  g.strokeStyle = col; g.fillStyle = col;
  g.lineWidth = Math.max(1.3, r * 0.34); g.lineCap = 'round';
  g.beginPath();
  for (let i = 0; i < 11; i++){
    const a = i / 11 * 6.2832 + (spin || 0);
    g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * r * 1.75, cy + Math.sin(a) * r * 1.75);
  }
  g.stroke();
  g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.28)';
  g.beginPath(); g.arc(cx - r * 0.32, cy - r * 0.32, r * 0.34, 0, 7); g.fill();
  g.restore();
}

  g.strokeRect(x0 + g.lineWidth / 2, y0 + g.lineWidth / 2, s - g.lineWidth, s - g.lineWidth);
  drawSpikeBall(g, x0 + s / 2, y0 + s / 2, s * 0.22, '#8a4fce', T);

}

function drawSolid(s){
  if (s.kind === 'green'){
    ctx.fillStyle = '#37d84a'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(s.x, s.y, s.w, 2);
    return;
  }
  if (s.kind === 'coral'){
    ctx.fillStyle = '#ff8f7a'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#ffd0a0'; ctx.fillRect(s.x, s.y, s.w, 5);
    return;
  }
  if (s.kind === 'rock'){
    ctx.fillStyle = '#8f8578'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = '#6b6256'; ctx.lineWidth = 2; ctx.strokeRect(s.x + 1, s.y + 1, s.w - 2, s.h - 2);
    ctx.strokeStyle = 'rgba(40,36,30,.5)'; ctx.beginPath();
    ctx.moveTo(s.x + s.w * 0.3, s.y); ctx.lineTo(s.x + s.w * 0.55, s.y + s.h * 0.5); ctx.lineTo(s.x + s.w * 0.35, s.y + s.h);
    ctx.moveTo(s.x + s.w * 0.7, s.y + s.h * 0.15); ctx.lineTo(s.x + s.w, s.y + s.h * 0.55);
    ctx.stroke();
    return;
  }
  if (s.kind === 'tight'){
    ctx.fillStyle = '#5a5550'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = '#2c2926'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(s.x + s.w * 0.5, s.y);
    ctx.lineTo(s.x + s.w * 0.4, s.y + s.h * 0.35);
    ctx.lineTo(s.x + s.w * 0.6, s.y + s.h * 0.7);
    ctx.lineTo(s.x + s.w * 0.45, s.y + s.h);
    ctx.stroke();
    label(ctx, s.x + s.w / 2, s.y - 6, 'crack', '#cfc8bd');
    return;
  }
  if (s.kind === 'floor'){
    ctx.fillStyle = '#4a4650'; ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = '#565360'; ctx.fillRect(s.x, s.y, s.w, 6);
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let tx = s.x + 40; tx < s.x + s.w; tx += 40){ ctx.moveTo(tx, s.y); ctx.lineTo(tx, s.y + 24); }
    ctx.stroke();
    return;
  }
  if (s.kind === 'placed'){ drawUrchinBlock(ctx, s.x, s.y, s.w); return; }
  // 2D-Minecraft-ish blocks: flat base + a checker of darker cells + grid lines,
  // and a grass (or sand) cap on top. Only the visible surface band is tiled.
  const TS = 22;
  const sand = s.kind === 'sand', wall = s.kind === 'wall', dirt = s.kind === 'dirt';
  const d1 = sand ? '#dcc078' : wall ? '#6b5140' : dirt ? '#5b4028' : '#7c5636';
  const d2 = sand ? '#ccae62' : wall ? '#5b4433' : dirt ? '#4a331f' : '#6a4629';
  ctx.fillStyle = d1; ctx.fillRect(s.x, s.y, s.w, s.h);
  const band = Math.min(s.h, TS * 4);
  ctx.fillStyle = d2;
  for (let row = 0, ty = s.y; ty < s.y + band; ty += TS, row++)
    for (let tx = s.x + (row & 1 ? TS : 0); tx < s.x + s.w; tx += TS * 2)
      ctx.fillRect(tx, ty, Math.min(TS, s.x + s.w - tx), Math.min(TS, s.y + s.h - ty));
  ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let tx = s.x + TS; tx < s.x + s.w; tx += TS){ ctx.moveTo(tx, s.y); ctx.lineTo(tx, s.y + band); }
  for (let ty = s.y + TS; ty < s.y + band; ty += TS){ ctx.moveTo(s.x, ty); ctx.lineTo(s.x + s.w, ty); }
  ctx.stroke();
  if (s.kind === 'ground' || s.kind === 'ledge'){
    for (let tx = s.x, i = 0; tx < s.x + s.w; tx += TS, i++){
      ctx.fillStyle = (i & 1) ? '#5fae35' : '#57a12f';
      ctx.fillRect(tx, s.y, Math.min(TS, s.x + s.w - tx), 7);
    }
    ctx.strokeStyle = '#4d9a2b'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
    for (let gx = s.x + 6; gx < s.x + s.w; gx += TS){
      ctx.moveTo(gx, s.y); ctx.lineTo(gx + Math.sin(gx * 0.3 + T) * 1.5, s.y - 4);
      ctx.moveTo(gx + 9, s.y); ctx.lineTo(gx + 9 + Math.sin(gx * 0.4 + T) * 1.5, s.y - 3);
    }
    ctx.stroke();
  } else if (sand){
    ctx.fillStyle = '#ecd9a0'; ctx.fillRect(s.x, s.y, s.w, 5);
  }
}

  drawCokco(P.x, P.y, P.face, P.walk, P.squash, P.form);

  ctx.restore();

  drawNightTint(true);

  if (fx > 0.01){ ctx.fillStyle = 'rgba(6,8,16,' + (fx * 0.85).toFixed(3) + ')'; ctx.fillRect(0, 0, VW, VH); }

  if (trans){
    const a = trans.t < 0.32 ? trans.t / 0.32 : (0.64 - trans.t) / 0.32;
    ctx.fillStyle = 'rgba(6,10,20,' + clamp(a, 0, 1) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}
function drawUrchin(u){
  if (u.type === 'plus'){
    ctx.fillStyle = '#37d84a'; ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#0a5a2a'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+2', u.x, u.y); ctx.textBaseline = 'alphabetic';
    return;
  }
  const col = u.type === 'blue' ? '#4aa3ff' : u.type === 'x2' ? '#ffcf3f' : '#c65cff';
  drawSpikeBall(ctx, u.x, u.y, u.r, col, T);
  if (u.type === 'x2'){
    ctx.fillStyle = '#3a2a00'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('x2', u.x, u.y); ctx.textBaseline = 'alphabetic';
  }
}
function renderMinigame(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#06283a'); g.addColorStop(1, '#0f5a70');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  for (const b of mgBub){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }

  // bucket
  const bkx = bucketX();
  ctx.fillStyle = '#caa46a'; ctx.fillRect(bkx - 34, VH - 96, 68, 60);
  ctx.fillStyle = '#8a6a44'; ctx.fillRect(bkx - 38, VH - 100, 76, 8);
  ctx.fillStyle = '#7a3b6b';
  const filled = Math.min(6, MG.score);
  for (let i = 0; i < filled; i++) { ctx.beginPath(); ctx.arc(bkx - 20 + (i % 3) * 20, VH - 52 - Math.floor(i / 3) * 18, 6, 0, 7); ctx.fill(); }

  for (const u of MG.urchins) drawUrchin(u);

  // basket + Cokco
  const bw = basketW(), by = basketY();
  ctx.strokeStyle = '#d8c090'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(MG.bx, by + 6, bw / 2, Math.PI, 2 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MG.bx - bw / 2, by + 6); ctx.lineTo(MG.bx + bw / 2, by + 6); ctx.stroke();
  ctx.fillStyle = '#7a3b6b';
  for (let i = 0; i < MG.basket.length; i++){ ctx.beginPath(); ctx.arc(MG.bx - bw/2 + 10 + i * 12, by, 4, 0, 7); ctx.fill(); }
  drawCokco(MG.bx - 13, by + 14, 0, held('left') || held('right') ? T * 12 : 0, 0);

  // HUD
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = 'bold 20px system-ui';
  ctx.fillText('Score  ' + MG.score + ' / ' + MG.target, 24, 40);
  ctx.font = '16px system-ui';
  ctx.fillText('Time  ' + Math.max(0, Math.ceil(MG.time)), 24, 66);
  ctx.fillText('Basket  ' + MG.basket.length + ' / ' + MG.cap + '   (walk left to the bucket to bank)', 24, 88);
  ctx.textAlign = 'center'; ctx.font = '13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('move ← →   ·   green +2 grows the basket   ·   blue = Blue Pearl   ·   Esc to leave', VW / 2, VH - 22);

  drawNightTint(false);

  if (MG.result){
    ctx.fillStyle = 'rgba(6,10,20,.6)'; ctx.fillRect(0, VH / 2 - 60, VW, 120);
    ctx.fillStyle = MG.result === 'win' ? '#8fffa8' : '#ffb3a0';
    ctx.font = 'bold 40px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(MG.result === 'win' ? 'The water calms...' : 'They got away!', VW / 2, VH / 2 + 12);
  }
}

/* ---------- 12. UI panels ---------- */
const panelEl = document.getElementById('panel');
const PANEL = {
  bag(){
    let slots = '';
    for (let i = 0; i < 10; i++){
      const s = G.inv[i];
      if (!s){ slots += '<div class="slot"></div>'; continue; }
      const it = ITEMS[s.id];
      const ic = it.art
        ? '<canvas class="ic" width="46" height="46" data-art="' + s.id + '"></canvas>'
        : '<div class="ic">' + it.icon + '</div>';
      slots += '<div class="slot">' + ic + '<div>' + esc(it.name) + '</div><div class="q">x' + s.qty + '</div></div>';
    }
    return '<h2>Bag</h2><p style="opacity:.7;font-size:13px">10 pockets &middot; up to 20 of each' +
           '<br>🪙 ' + G.coins + ' Cokco-Coins &middot; 💎 ' + G.gems + ' gems</p>' +
           '<div class="grid">' + slots + '</div>' +
           '<button class="btn" data-act="resume">Close</button>';
  },
  craft(){
    const rows = RECIPES.map(r => {
      const ok = canCraft(r);
      const cost = r.cost.map(([id, n]) =>
        n + '&times; ' + esc(ITEMS[id] ? ITEMS[id].name : id) + ' <span style="opacity:.6">(' + have(id) + ')</span>').join(' &middot; ');
      return '<div class="qz"><b>' + esc(r.name) + '</b>' +
        '<div class="o">' + esc(r.blurb) + '<br>needs ' + cost + '</div>' +
        '<button class="btn' + (ok ? '' : ' alt') + '" data-act="craft:' + r.id + '"' + (ok ? '' : ' disabled') + '>Craft</button></div>';
    }).join('');
    return '<h2>Crafting table</h2>' + rows + '<button class="btn alt" data-act="resume">Close</button>';
  },
  door(){
    const list = doorChoices.map((d, i) =>
      '<button class="btn" data-act="door:' + i + '">Door ' + d.num + '</button>').join(' ');
    return '<h2>Which door?</h2><p style="opacity:.75;font-size:13px">Tap one, or press its number key. Numbers match the signs above each door.</p>' +
      '<div>' + list + '</div><div style="margin-top:10px"></div>' +
      '<button class="btn alt" data-act="resume">Never mind</button>';
  },
  shop(){
    const rows = shopNPC.stock.map((s, i) => {
      const ok = G.coins >= s.cost;
      return '<div class="qz"><b>' + esc(itemName(s.id)) + '</b>' +
        '<div class="o">' + s.cost + ' Cokco-coins <span style="opacity:.6">(you have ' + G.coins + ')</span></div>' +
        '<button class="btn' + (ok ? '' : ' alt') + '" data-act="buy:' + i + '"' + (ok ? '' : ' disabled') + '>Buy</button></div>';
    }).join('');
    return '<h2>' + esc(shopNPC.name) + "&rsquo;s shop</h2>" + rows + '<button class="btn alt" data-act="resume">Leave</button>';
  },
  problems(){
    const rows = Object.keys(QUESTS).map(id => {
      const q = QUESTS[id], st = G.quests[id], done = st === 'done';
      let line = done ? 'Solved.'
        : st === 'inactive' ? 'Not started — talk to the creatures.'
        : objectiveFor(id);
      return '<div class="qz ' + (done ? 'done' : '') + '"><b>' + esc(q.title) + '</b><div class="o">' + esc(line) + '</div></div>';
    }).join('');
    const all = Object.values(G.quests).every(s => s === 'done');
    return '<h2>Problems</h2><p style="opacity:.75;font-size:13px">Goal: solve every problem the creatures tell you about.</p>' +
      rows + (all ? '<div class="qz">Every known problem is solved. Keep exploring — more will sprout.</div>' : '') +
      '<button class="btn" data-act="resume">Close</button>';
  },
  menu(){
    return '<h2>Menu</h2>' +
      '<button class="btn" data-act="resume">Resume</button>' +
      '<button class="btn alt" data-act="home">Go Home</button>' +
      '<button class="btn alt" data-act="map">Map</button>' +
      '<button class="btn alt" data-act="reset">Reset game</button>';
  },
  map(){
    const cur = world.key;
    const row = (id, icon, note) =>
      (cur === id ? '&#9654; ' : '&nbsp;&nbsp;&nbsp;') + icon + ' ' + WORLDS[id].name +
      (G.flags['visited_' + id] ? '' : ' <span style="opacity:.5">(not visited)</span>') +
      ' <span style="opacity:.55;font-size:13px">' + note + '</span>';
    const rows = [
      row('home', '&#127969;', '— hub; doors to the Centre &amp; the Cellar'),
      row('ocean', '&#127754;', '— drop-hole in Home; doors to the Museum &amp; the Cave'),
      row('flatten', '&#128295;', '— door in Home; Sxco flattens urchins'),
      row('waterworks', '&#127993;', '— door in the Ocean layer'),
      row('dirt', '&#9935;', '— Cave door in the Ocean layer; shops &amp; gold'),
    ];
    if (G.flags.visited_beach) rows.push(row('beach', '&#127958;', '— SECRET; a door behind the smashed boulder'));
    return '<h2>Map</h2><p style="font-size:13px;opacity:.75">Drop-holes and doors connect the layers.</p>' +
      '<div style="font-size:14px;line-height:2.2">' + rows.join('<br>') +
      '</div><button class="btn" data-act="menu">Back</button>';
  },
};
function objectiveFor(id){
  if (id === 'ocean') return G.flags.oceanCalm
    ? 'Tell Wriggo the water is calm.'
    : "Drop into the Ocean layer and beat Clawdia's catching challenge.";
  if (id === 'craft') return 'Bring Crafto 3 Sea Urchins (you have ' + invCount('urchin') + ').';
  if (id === 'pearl') return 'Catch the blue urchin, bring Sella a Blue Pearl (you have ' + invCount('blue-pearl') + ').';
  if (id === 'hammer') return G.rocks['home:r0']
    ? 'Tell Boulda you smashed the boulder.'
    : 'Press Q for hammer form, then press E by the boulder to smash it.';
  if (id === 'swim') return invCount('spyglass') >= 1
    ? "Take Marlo's Spyglass back to him."
    : 'Swim up the tall pillar (keep tapping up) and grab the Spyglass.';
  if (id === 'slime') return G.picked['pk:ocean:0']
    ? 'Tell Nook what was behind the crack.'
    : 'Get a Slime Orb (Sxco → Orb Card → scan it), then ooze through the crack.';
  if (id === 'block') return invCount('urchin-fossil') >= 1
    ? 'Take the Urchin Fossil back to Curato.'
    : 'Press B to stack Sea Urchin Blocks up to the museum shelf and grab the Fossil.';
  if (id === 'climb') return invCount('kite') >= 1
    ? "Take the kite back to Sandy."
    : 'Become the snake (Q), climb the cliff wall (into it + hold ↑), and grab the kite.';
  if (id === 'dirtfly') return invCount('cave-crystal') >= 1
    ? 'Take the Cave Crystal to Pip.'
    : 'Become the flyer (Q), hold ↑ to fly into the Dirt-layer alcove, grab the Cave Crystal.';
  return '';
}
function primaryObjective(){
  const q = G.quests;
  for (const id of ['ocean', 'hammer', 'swim', 'slime', 'block', 'climb', 'dirtfly', 'craft', 'pearl'])
    if (q[id] === 'active' || q[id] === 'ready') return objectiveFor(id) || 'Talk to the creatures.';
  if (Object.values(q).every(s => s === 'done')) return 'Explore — new problems will appear.';
  return 'Talk to the creatures. They each have a problem.';
}
function setPanel(kind){
  panelKind = kind;
  panelEl.innerHTML = PANEL[kind]();
  wirePanel();
  paintPanelArt();
}
function openPanel(kind){ mode = 'panel'; setPanel(kind); }
function closePanel(){ mode = 'play'; panelKind = null; }
function paintPanelArt(){
  panelEl.querySelectorAll('canvas[data-art]').forEach(cv => {
    const g = cv.getContext('2d'); if (!g) return;
    g.clearRect(0, 0, cv.width, cv.height);
    const id = cv.dataset.art, m = cv.width / 2;
    if (ITEMS[id].art === 'spikeball') drawSpikeBall(g, m, m, cv.width * 0.26, '#8a4fce', 0.5);
    else if (ITEMS[id].art === 'block') drawUrchinBlock(g, 4, 4, cv.width - 8);
    else if (ITEMS[id].art === 'flat'){
      g.fillStyle = '#8a4fce'; g.beginPath(); g.ellipse(m, m, m * 0.7, m * 0.28, 0, 0, 7); g.fill();
      g.strokeStyle = '#8a4fce'; g.lineWidth = 2;
      for (let a = 0; a < 8; a++){ const an = a / 8 * 6.2832; g.beginPath(); g.moveTo(m, m); g.lineTo(m + Math.cos(an) * m * 0.9, m + Math.sin(an) * m * 0.4); g.stroke(); }
    }
  });
}
function wirePanel(){
  panelEl.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'resume') closePanel();
      else if (a === 'home'){ closePanel(); travel('home', 'spawn'); }
      else if (a === 'map') setPanel('map');
      else if (a === 'menu') setPanel('menu');
      else if (a.startsWith('craft:')){ craftRecipe(a.slice(6)); setPanel('craft'); }
      else if (a.startsWith('door:')){ const i = +a.slice(5); closePanel(); doorWarp(doorChoices[i]); }
      else if (a.startsWith('buy:')){ buyFromShop(+a.slice(4)); setPanel('shop'); }
      else if (a === 'reset'){
        if (confirm('Erase your game and start over?')){
          try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
          G = blankSave(); persist();
          loadWorld('home'); placePlayer(world.arrivals.spawn);
          closePanel();
        }
      }
    };
  });
}

/* ---------- 13. main loop ---------- */
function update(){
  T += dt;
  fx = Math.max(0, fx - dt * 2.6);
  toasts.forEach(x => x.t -= dt);
  toasts = toasts.filter(x => x.t > 0);

  const m0 = mode;
  if (m0 === 'play') updatePlay();
  else if (m0 === 'dialogue'){
    if (key('KeyE', 'Enter', 'Space')) advanceDialogue();
    else if (key('Escape')){ dialogue = null; mode = 'play'; }
  }
  else if (m0 === 'panel'){
    if (key('Escape') || (panelKind === 'bag' && key('KeyI')) || (panelKind === 'problems' && key('KeyJ'))) closePanel();
    else if (panelKind === 'door'){
      for (const d of doorChoices)
        if (d.num <= 9 && key('Digit' + d.num, 'Numpad' + d.num)){ closePanel(); doorWarp(d); break; }
    }
  }
  else if (m0 === 'minigame') updateMinigame();
  else if (m0 === 'transition') updateTransition();

  // panel hotkeys — only when this tick began in play and is still in play
  // (otherwise the same Esc/I/J press that closed a panel would re-open one)
  if (m0 === 'play' && mode === 'play'){
    if (key('KeyI')) openPanel('bag');
    else if (key('KeyJ')) openPanel('problems');
    else if (key('Escape')) openPanel('menu');
  }

  clearTaps();
}
function syncDOM(){
  syncTouchUI();
  const showHud = mode === 'play' || mode === 'dialogue';
  document.getElementById('hud').classList.toggle('hidden', !showHud);
  document.getElementById('hint').classList.toggle('hidden', mode !== 'play');
  document.getElementById('dialogue').classList.toggle('hidden', mode !== 'dialogue');
  panelEl.classList.toggle('hidden', mode !== 'panel');

  if (showHud && world){
    document.getElementById('worldName').textContent = world.name;
    document.getElementById('obj').textContent = primaryObjective();
    const formTag = P.form === 'slime' ? '<span>🟢 slime</span>'
                  : P.form === 'hammer' ? '<span>🔨 hammer</span>'
                  : P.form === 'snake' ? '<span>🐍 snake</span>'
                  : P.form === 'fly' ? '<span>🕊️ fly</span>' : '';
    document.getElementById('urch').innerHTML = formTag +
      '<span>🦔 ' + invCount('urchin') + '</span><span>🐚 ' + invCount('shell') +
      '</span><span>🪙 ' + G.coins + '</span><span>💎 ' + G.gems + '</span>' +
      (G.gold > 0 ? '<span>⛏️ ' + G.gold + '</span>' : '') +
      (invCount('battery') > 0 ? '<span>🔋 ' + invCount('battery') + '</span>' : '');
  }
  if (mode === 'play') document.getElementById('hint').textContent = hintText;
  if (mode === 'dialogue' && dialogue){
    document.querySelector('#dialogue .who').textContent = dialogue.who;
    document.querySelector('#dialogue .txt').textContent = dialogue.lines[dialogue.i];
  }
  document.getElementById('toast').innerHTML =
    toasts.map(x => '<div class="toast" style="opacity:' + clamp(x.t, 0, 1).toFixed(2) + '">' + esc(x.m) + '</div>').join('');
}
function render(){
  if (mode === 'minigame'){ renderMinigame(); return; }
  if (world) renderWorld();
  else ctx.clearRect(0, 0, VW, VH);
}
let last = performance.now();
function frame(nowMs){
  dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs;
  update();
  render();
  syncDOM();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function beginGame(id, usePos){
  loadWorld(id);
  if (usePos && G.px != null) placePlayer({ x: G.px, y: G.py });
  else placePlayer(world.arrivals.spawn);
  document.getElementById('title').classList.add('hidden');
  mode = 'play';
}
document.getElementById('playBtn').onclick = () => {
  if (hasSave()){ G = loadGame(); beginGame(G.world || 'home', true); }
  else { G = blankSave(); persist(); beginGame('home', false); }
};
document.getElementById('newBtn').onclick = () => {
  if (hasSave() && !confirm('Start a fresh game? Your current one will be erased.')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  G = blankSave(); persist();
  beginGame('home', false);
};
addEventListener('keydown', e => {
  if (mode === 'title' && (e.code === 'Enter' || e.code === 'Space')) document.getElementById('playBtn').click();
});

resize();
requestAnimationFrame(frame);
</script>
